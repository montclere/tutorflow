[project]
name = "tutorflow-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=23,<26",
    "email-validator>=2,<3",
    "fastapi>=0.121,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "starlette>=1,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "httpx2>=2,<3",
]

[tool.ruff]
extend = "../ruff.toml"

[tool.pyright]
include = ["app", "tests", "../scripts"]
exclude = [".venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

pythonpath = ["."]
