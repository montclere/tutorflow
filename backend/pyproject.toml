[project]
name = "tutorflow-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1,<6",
    "alembic>=1.13,<2",
    "argon2-cffi>=23,<26",
    "email-validator>=2,<3",
    "fastapi",
    "httpx>=0.28,<1",
    "prometheus-client>=0.24,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "structlog>=26.1,<27",
    "uvicorn",
]

[dependency-groups]
dev = [
 "pyright",
 "pytest",
 "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["br_087: несколько ролей и самосвязи", "br_088: несколько ролей и самосвязи", "br_089: несколько ролей и самосвязи", "br_090: несколько ролей и самосвязи", "br_013: доступ взрослого", "br_014: доступ взрослого", "br_015: доступ взрослого", "br_016: доступ взрослого", "br_017: доступ взрослого", "br_018: доступ взрослого", "br_082: доступ взрослого", "br_083: доступ взрослого", "br_084: доступ взрослого", "br_085: доступ взрослого", "br_086: доступ взрослого", "br_005: API учеников", "br_006: API учеников", "br_007: API учеников", "br_008: API учеников", "br_009: API учеников", "br_010: API учеников", "br_011: API учеников", "br_012: API учеников", "br_076: API учеников", "br_077: API учеников", "br_078: API учеников", "br_079: API учеников", "br_080: API учеников", "br_081: API учеников", "br_001: регистрация и доступ к кабинету", "br_002: необязательный профиль", "br_004: часовой пояс нового блока", "br_075: явные роли аккаунта"]
