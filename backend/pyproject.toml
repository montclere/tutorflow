[project]
name = "tutorflow-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "pydantic>=2,<3", "uvicorn"]

[dependency-groups]
dev = ["httpx", "pyright", "pytest", "ruff"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
