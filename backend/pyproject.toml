[project]
name = "tutorflow-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1,<6",
    "alembic>=1.13,<2",
    "argon2-cffi>=23,<26",
    "email-validator>=2,<3",
    "fastapi",
    "httpx>=0.28,<1",
    "prometheus-client>=0.24,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "structlog>=26.1,<27",
    "uvicorn",
]

[dependency-groups]
dev = [
 "pyright",
 "pytest",
 "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
