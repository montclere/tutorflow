[project]
name = "tutorflow-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23,<26",
    "email-validator>=2,<3",
    "fastapi",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "uvicorn",
]

[dependency-groups]
dev = ["httpx", "pyright", "pytest", "ruff"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["br_001: регистрация и доступ к кабинету", "br_002: необязательный профиль", "br_075: единственная роль"]
