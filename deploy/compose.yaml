services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tutorflow
      POSTGRES_USER: tutorflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите пароль локальной БД в deploy/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, tutorflow, -d, tutorflow]
      interval: 3s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: ["identity"]
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:${IDENTITY_MAILPIT_PORT:-1025}:1025"
      - "127.0.0.1:${IDENTITY_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
