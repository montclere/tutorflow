minimum_pre_commit_version: '4.7.0'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]
  - repo: local
    hooks:
      - id: tutorflow-spec
        name: Связи UC и BR
        entry: python3 scripts/check.py spec
        language: system
        pass_filenames: false
        files: ^(docs/(modules/[^/]+/business-rules|use-cases/[^/]+|templates/[^/]+)\.md|scripts/(check(-spec)?|specification)\.py)$
      - id: tutorflow-commit-message
        name: Формат сообщения коммита
        entry: python3 scripts/check.py commit-message
        language: system
        stages: [commit-msg]
