version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    versioning-strategy: lockfile-only
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: npm
    directories: [/frontend, /tests/e2e]
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 3
    groups:
      javascript:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
