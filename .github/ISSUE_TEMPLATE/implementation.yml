name: Бизнес-правило
description: Проверяемое правило TutorFlow в рамках пользовательского сценария
title: "[BR-XXX] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Результат
      description: Какое поведение должно стать доступным?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: Успех, отказ и пограничный случай, если применимы.
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Зависимости
      description: Укажи связанные блокирующие задачи, если они есть.
  - type: textarea
    id: scope
    attributes:
      label: Границы
      description: Укажи исключения из объёма задачи, если они нужны.
