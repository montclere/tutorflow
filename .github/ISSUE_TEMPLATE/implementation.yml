name: Business rule implementation
description: Реализация группы бизнес-правил TutorFlow
title: "[BR] "
labels: ["type:implementation"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Цель и наблюдаемый результат
      description: Что сможет сделать пользователь после выполнения?
    validations:
      required: true
  - type: input
    id: br
    attributes:
      label: BR-ID
      placeholder: "BR-005, BR-006"
    validations:
      required: true
  - type: input
    id: uc
    attributes:
      label: UC-ID
      placeholder: "UC-002"
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: Положительный, негативный, пограничный сценарии
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Зависимости и ограничения
      description: Номера блокирующих Issues или «нет»
